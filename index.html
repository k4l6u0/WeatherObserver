<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天氣變化？ BUILD 260212an</title>
    
    <style>
        /* Dark Mode 全局設定 */
        body { 
            font-family: "Microsoft JhengHei", "Segoe UI", sans-serif; 
            background-color: #000000; 
            color: #e0e0e0; 
            margin: 0; padding: 20px; 
        }
        
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            background: #0a0a0a; 
            padding: 0; 
            border-radius: 16px; 
            box-shadow: 0 20px 50px rgba(255,255,255,0.05); 
            overflow: hidden; 
            border: 1px solid #333;
        }
        
        /* Header */
        header { 
            background: linear-gradient(135deg, #2c3e50, #4ca1af); 
            padding: 25px 35px; 
            color: white; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #333;
            position: relative;
            overflow: hidden;
        }
        
        header::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(rgba(255,255,255,0.2) 15%, transparent 16%),
                radial-gradient(rgba(255,255,255,0.2) 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            opacity: 0.15;
            animation: snow 10s linear infinite;
        }
        @keyframes snow { from {background-position: 0 0, 30px 30px;} to {background-position: 0 60px, 30px 90px;} }

        .header-left { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: flex-start; }
        .header-left h1 { margin: 0; font-size: 2.2rem; font-weight: 900; letter-spacing: 2px; color: #a8ff78; text-shadow: 0 0 15px rgba(168, 255, 120, 0.4); }
        .build-tag-block { font-family: monospace; font-size: 0.8rem; color: #0a0a0a; background: #a8ff78; padding: 2px 8px; border-radius: 4px; font-weight: bold; margin-top: 8px; display: inline-block; }
        
        .hud-display { display: flex; gap: 15px; margin-top: 15px; font-size: 0.85rem; font-weight: 600; color: #999; }
        .hud-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 5px currentColor; }

        .header-right { position: relative; z-index: 2; }
        .reload-btn {
            background: rgba(168, 255, 120, 0.1); border: 1px solid rgba(168, 255, 120, 0.5); color: #a8ff78;
            padding: 10px 25px; border-radius: 30px; font-weight: bold; cursor: pointer;
            transition: all 0.3s ease; font-size: 0.9rem; display: flex; align-items: center; gap: 8px;
        }
        .reload-btn:hover { background: rgba(168, 255, 120, 0.2); box-shadow: 0 0 20px rgba(168, 255, 120, 0.4); transform: translateY(-2px); }

        .content-body { padding: 10px 25px 25px 25px; }
        
        #status-log { text-align: center; font-family: monospace; color: #666; margin: 10px 0; font-size: 0.8rem; padding: 5px; min-height: 20px; }
        .error-msg { color: #ff5252; font-weight: bold; border: 1px solid #ff5252; padding: 10px; margin-top: 10px; }

        .chart-container { position: relative; height: 900px; width: 100%; margin-top: 10px; }

        footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid #333; color: #555; font-size: 0.8rem; font-family: Consolas, monospace; }
        .version-tag { background: #333; padding: 2px 6px; border-radius: 3px; font-weight: bold; color: #ccc; margin-right: 5px; }
    </style>

    <!-- 1. 更換為更穩定的 cdnjs 來源，並加入錯誤監聽 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" 
            onerror="alert('CRITICAL ERROR: 無法載入 Chart.js 核心庫。\n請檢查網路連線或防火牆設定。');"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"
            onerror="alert('WARNING: 無法載入 DataLabels 插件，圖表將無法顯示數值。');"></script>
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <h1>天氣變化？ (體感+雨量)</h1>
            <span class="build-tag-block">BUILD 260212an (CDN Fix)</span>
            <div class="hud-display">
                <div class="hud-item"><span class="dot" style="background:#B388FF; box-shadow: 0 0 5px #B388FF"></span> 西路</div>
                <div class="hud-item"><span class="dot" style="background:#448AFF; box-shadow: 0 0 5px #448AFF"></span> 東路</div>
                <div class="hud-item"><span class="dot" style="background:#00E5FF; box-shadow: 0 0 5px #00E5FF"></span> 新店雨量</div>
            </div>
        </div>
        <div class="header-right">
            <button class="reload-btn" onclick="startSystem()">
                <span>⚡</span> RELOAD
            </button>
        </div>
    </header>

    <div class="content-body">
        <div id="status-log">系統啟動中... (Booting)</div>

        <div class="chart-container">
            <canvas id="weatherChart"></canvas>
        </div>

        <footer>
            <h3>System Logs</h3>
            <ul>
                <li><span class="version-tag">260212an</span> <b>CDN 救援 (CDN Rescue)</b>：切換圖表核心庫來源至 <b>cdnjs (Cloudflare)</b>，解決部分網路環境下 jsdelivr 無法載入導致畫面卡在「初始化」的問題。</li>
                <li><span class="version-tag">260212al</span> 監測點修正：台北數據改採新店區 (Xindian) 資料。</li>
            </ul>
        </footer>
    </div>
</div>

<script>
    // 狀態更新
    function updateStatus(msg, isError = false) {
        const el = document.getElementById('status-log');
        if (el) {
            el.innerHTML = msg;
            el.className = isError ? 'error-msg' : '';
            if (isError) el.style.color = '#ff5252';
        }
        console.log("[System]", msg);
    }

    // 定義地點 (新店座標)
    const locations = {
        ham: { name: '哈密 (西)', lat: 42.82, lon: 93.51, color: '#B388FF' },
        xia: { name: '西安 (西)', lat: 34.34, lon: 108.94, color: '#FFB74D' },
        wuh: { name: '武漢 (西)', lat: 30.59, lon: 114.30, color: '#69F0AE' },
        yak: { name: '雅庫次克 (東)', lat: 62.03, lon: 129.74, color: '#448AFF' },
        bei: { name: '北京 (東)', lat: 39.90, lon: 116.40, color: '#4DD0E1' },
        sha: { name: '上海 (東)', lat: 31.23, lon: 121.47, color: '#80DEEA' },
        tpe: { name: '台北/新店', lat: 24.96, lon: 121.54, color: '#FF5252' }
    };

    let myChart = null;

    // 圖表插件
    const weekendPlugin = {
        id: 'weekendPlugin',
        beforeDraw: (chart) => {
            const { ctx, chartArea: { top, bottom, height }, scales: { x } } = chart;
            ctx.save();
            x.ticks.forEach((tick, index) => {
                const dateStr = chart.data.rawDates[index];
                if (!dateStr) return;
                const dayOfWeek = new Date(dateStr).getDay();
                if (dayOfWeek === 0 || dayOfWeek === 6) {
                    const width = x.width / x.ticks.length;
                    const xPos = x.getPixelForTick(index) - (width / 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.03)'; 
                    ctx.fillRect(xPos, top, width, height);
                    ctx.fillStyle = '#444';
                    ctx.font = 'bold 10px "Segoe UI"';
                    ctx.textAlign = 'center';
                    ctx.fillText(dayOfWeek === 6 ? "SAT" : "SUN", x.getPixelForTick(index), top + 25);
                }
            });
            ctx.restore();
        }
    };

    function getWeatherEmoji(code) {
        if (code === undefined || code === null) return ''; 
        if (code === 0) return '☀️'; 
        if (code <= 3) return '☁️'; 
        if (code <= 48) return '🌁'; 
        if (code <= 67) return '🌧️'; 
        if (code <= 77) return '❄️'; 
        if (code <= 82) return '🌧️'; 
        if (code <= 86) return '🌨️'; 
        if (code <= 99) return '⛈️'; 
        return '';
    }

    async function analyzeWeather() {
        updateStatus("🛰️ 連線氣象衛星中 (Connecting)...");

        try {
            // 雙重檢查 Chart.js
            if (typeof Chart === 'undefined') {
                throw new Error("Chart.js 未成功載入，請嘗試重新整理網頁。");
            }

            const keys = Object.keys(locations);
            const promises = keys.map(key => {
                const loc = locations[key];
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&daily=apparent_temperature_min,precipitation_sum,weathercode&timezone=auto&forecast_days=16`;
                return fetch(url).then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                });
            });

            const results = await Promise.all(promises);
            updateStatus("⚡ 數據運算中 (Calculating)...");

            const weatherData = {};
            const rainData = {}; 
            const weatherCodes = {};
            const rawDates = results[0].daily.time;
            const displayLabels = rawDates.map(date => date.substring(5).replace('-', '/'));

            keys.forEach((key, index) => {
                weatherData[key] = results[index].daily.apparent_temperature_min;
                rainData[key] = results[index].daily.precipitation_sum;
                weatherCodes[key] = results[index].daily.weathercode;
            });

            updateStatus("🎨 繪製圖表中 (Rendering)...");
            drawIntegratedChart(displayLabels, rawDates, weatherData, rainData, weatherCodes);
            updateStatus("✅ 數據更新完成 (Last Update: " + new Date().toLocaleTimeString() + ")");

        } catch (error) {
            console.error(error);
            updateStatus("⚠️ 發生錯誤: " + error.message, true);
            alert("系統錯誤:\n" + error.message);
        }
    }

    function drawIntegratedChart(labels, rawDates, tempMap, rainMap, codeMap) {
        const ctx = document.getElementById('weatherChart').getContext('2d');
        if (myChart) myChart.destroy();

        const gridColor = 'rgba(255, 255, 255, 0.08)';
        const textColor = '#888';
        const titleColor = '#ccc';

        const createDataset = (key, axisId, fontSize = 12) => ({
            label: locations[key].name,
            data: tempMap[key],
            borderColor: locations[key].color,
            backgroundColor: locations[key].color,
            borderWidth: 2,
            pointRadius: 4, 
            yAxisID: axisId,
            order: 1, 
            datalabels: {
                align: 'top',
                anchor: 'center',
                offset: 4,
                color: '#fff',
                textStrokeColor: '#000', 
                textStrokeWidth: 3, 
                font: { size: fontSize, weight: 'bold' },
                formatter: (value, ctx) => {
                    const code = codeMap[key][ctx.dataIndex];
                    return Math.round(value) + '°\n' + getWeatherEmoji(code);
                },
                textAlign: 'center'
            }
        });

        const datasets = [
            createDataset('ham', 'yRow1', 12),
            createDataset('yak', 'yRow1', 12),
            createDataset('xia', 'yRow2', 12),
            createDataset('bei', 'yRow2', 12),
            createDataset('wuh', 'yRow3', 12),
            createDataset('sha', 'yRow3', 12),
            
            // 台北 (官方預報 - 體感)
            createDataset('tpe', 'yRow4', 15),

            // 台北 (雨量) - 柱狀圖
            {
                label: '降雨量 (mm)',
                data: rainMap['tpe'],
                type: 'bar',
                backgroundColor: 'rgba(0, 229, 255, 0.3)', 
                borderColor: 'rgba(0, 229, 255, 0.8)',
                borderWidth: 1,
                yAxisID: 'yRow4', 
                order: 2, 
                datalabels: {
                    align: 'end',
                    anchor: 'end',
                    offset: -2,
                    color: '#00E5FF', 
                    textStrokeColor: '#000',
                    textStrokeWidth: 2,
                    font: { size: 11, weight: 'bold' },
                    formatter: (value) => {
                        if (value > 0.5) return Math.round(value);
                        return '';
                    }
                }
            }
        ];

        myChart = new Chart(ctx, {
            type: 'line',
            data: { labels, datasets, rawDates },
            plugins: [weekendPlugin],
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: { top: 30, bottom: 20, left: 10, right: 10 } },
                interaction: { mode: 'index', intersect: false },
                scales: {
                    x: { 
                        grid: { display: false },
                        ticks: { color: textColor, font: { size: 11 } }
                    },
                    x2: {
                        position: 'top',
                        grid: { display: false },
                        ticks: {
                            color: textColor,
                            font: { size: 11 },
                            callback: function(value, index) {
                                const label = this.getLabelForValue(value);
                                const dateStr = rawDates[index];
                                const dayMap = ['日', '一', '二', '三', '四', '五', '六'];
                                const day = new Date(dateStr).getDay();
                                return `${label} (${dayMap[day]})`;
                            }
                        }
                    },
                    yRow1: {
                        type: 'linear', position: 'left',
                        stack: 'mainStack', stackWeight: 1, 
                        title: { display: true, text: '哈密 vs 雅庫次克', color: titleColor, font: {weight:'bold'} },
                        grid: { color: gridColor },
                        ticks: { color: textColor }
                    },
                    yRow2: {
                        type: 'linear', position: 'left',
                        stack: 'mainStack', stackWeight: 1,
                        title: { display: true, text: '西安 vs 北京', color: titleColor, font: {weight:'bold'} },
                        grid: { color: gridColor },
                        offset: true,
                        ticks: { color: textColor }
                    },
                    yRow3: {
                        type: 'linear', position: 'left',
                        stack: 'mainStack', stackWeight: 1,
                        title: { display: true, text: '武漢 vs 上海', color: titleColor, font: {weight:'bold'} },
                        grid: { color: gridColor },
                        offset: true,
                        ticks: { color: textColor }
                    },
                    yRow4: {
                        type: 'linear', position: 'left',
                        stack: 'mainStack', stackWeight: 1,
                        title: { display: true, text: '台北/新店 (體感/雨量)', color: '#FF5252', font: {weight:'bold'} },
                        grid: { color: gridColor },
                        offset: true,
                        ticks: { color: textColor },
                        beginAtZero: false 
                    }
                },
                plugins: {
                    legend: { 
                        display: true, 
                        position: 'top',
                        labels: { 
                            usePointStyle: true, 
                            padding: 20, 
                            font: {family: 'Segoe UI', size: 12},
                            color: textColor 
                        }
                    },
                    tooltip: { enabled: true }
                }
            }
        });
    }

    function startSystem() {
        updateStatus("系統啟動中... (Starting)");
        // 嘗試註冊插件 (如果已載入)
        if (typeof Chart !== 'undefined' && typeof ChartDataLabels !== 'undefined') {
            Chart.register(ChartDataLabels);
        }
        analyzeWeather();
    }
    
    // 立即執行，不等待 DOMContentLoaded (因為 script 在 body 底部)
    startSystem();
</script>

</body>
</html>
